<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Data Scout · Day 5 lab (local)</title>

  <link rel="stylesheet" href="/app.css" />

  <style>
    .ds-wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px 40px;
    }

    .ds-up {
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, sans-serif;

      transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .ds-up summary {
      cursor: pointer;
      font-weight: 600;
    }

    .ds-up .note {
      font-size: 12px;
      color: hsl(var(--muted-foreground));
    }

    .ds-up code {
      background: hsl(var(--muted));
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .ds-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-top: 10px;
    }

    .ds-up label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      color: hsl(var(--muted-foreground));
      margin-bottom: 4px;
    }

    .ds-up input[type="file"] {
      font: inherit;
      color: hsl(var(--foreground));
    }

    .ds-btn {
      font: inherit;
      border: 1px solid #2563eb;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: .2s ease;
    }

    .ds-btn:hover {
      background: #1d4ed8;
    }

    /* Theme button */
    .ds-theme-toggle {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;

      width: 48px;
      height: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      color: hsl(var(--foreground));

      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);

      cursor: pointer;
      font-size: 20px;

      transition:
        background-color .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .ds-theme-toggle:hover {
      transform: translateY(-2px);
    }

    .ds-theme-toggle:active {
      transform: scale(.95);
    }
  </style>
</head>

<body>

<script>
  /*
   * Read the SAME theme used by Skill Ranking Forecast.
   * This prevents a light-mode flash before app.css loads.
   */
  (function () {
    const theme = localStorage.getItem("theme") || "light";

    document.documentElement.classList.toggle(
      "dark",
      theme === "dark"
    );

    document.documentElement.setAttribute(
      "data-theme",
      theme
    );
  })();
</script>

<div class="ds-wrap">

  <details class="ds-up" id="dataCard">

    <summary>
      Data snapshot -
      <span
        id="dataStatus"
        style="font-weight:400"
      >
        checking…
      </span>
    </summary>

    <div class="ds-row" style="margin-top:12px">

      <div>
        <label>players.csv(.gz)</label>

        <input
          type="file"
          id="fPlayers"
          accept=".gz,.csv"
        />
      </div>

      <button
        class="ds-btn"
        onclick="uploadOne('fPlayers','players')"
      >
        Upload players
      </button>

      <span
        id="stPlayers"
        class="note"
      ></span>

    </div>

    <div class="ds-row">

      <div>
        <label>supplementary.csv(.gz)</label>

        <input
          type="file"
          id="fSupp"
          accept=".gz,.csv"
        />
      </div>

      <button
        class="ds-btn"
        onclick="uploadOne('fSupp','supplementary')"
      >
        Upload supplementary
      </button>

      <span
        id="stSupp"
        class="note"
      ></span>

    </div>

  </details>

  <div id="root"></div>

</div>


<!-- DARK / LIGHT MODE BUTTON -->

<button
  id="themeToggle"
  class="ds-theme-toggle"
  type="button"
  aria-label="Toggle dark mode"
  title="Toggle dark mode"
>
  🌙
</button>


<script>
  /*
   * Shared theme system
   * -------------------
   * Uses exactly the same localStorage key
   * as Skill Ranking Forecast:
   *
   *     "theme"
   *
   * Therefore both pages stay synchronized.
   */

  const themeToggle =
    document.getElementById("themeToggle");

  function getTheme() {
    return localStorage.getItem("theme") || "light";
  }

  function applyTheme(theme) {

    document.documentElement.classList.toggle(
      "dark",
      theme === "dark"
    );

    document.documentElement.setAttribute(
      "data-theme",
      theme
    );

    localStorage.setItem(
      "theme",
      theme
    );

    themeToggle.textContent =
      theme === "dark" ? "☀️" : "🌙";

    themeToggle.setAttribute(
      "aria-label",
      theme === "dark"
        ? "Switch to light mode"
        : "Switch to dark mode"
    );

    themeToggle.setAttribute(
      "title",
      theme === "dark"
        ? "Switch to light mode"
        : "Switch to dark mode"
    );
  }


  themeToggle.addEventListener(
    "click",
    function () {

      const currentTheme = getTheme();

      const nextTheme =
        currentTheme === "dark"
          ? "light"
          : "dark";

      applyTheme(nextTheme);
    }
  );


  /*
   * If the user changes theme on another page/tab,
   * update Data Scout automatically.
   */
  window.addEventListener(
    "storage",
    function (event) {

      if (event.key === "theme") {

        applyTheme(
          event.newValue || "light"
        );
      }
    }
  );


  applyTheme(getTheme());
</script>


<script>
  async function refreshDataStatus() {

    try {

      const s =
        await fetch("/status").then(
          r => r.json()
        );

      const el =
        document.getElementById(
          "dataStatus"
        );

      if ((s.player_rows || 0) > 0) {

        el.innerHTML =
          `<span style="color:#2f855a">
            loaded -
            ${(s.player_rows).toLocaleString()}
            player rows,
            ${(s.supplementary_rows || 0).toLocaleString()}
            supplementary
          </span>`;

        document.getElementById(
          "dataCard"
        ).open = false;

      } else {

        el.innerHTML =
          `<span style="color:#c53030">
            no data loaded -
            upload the files below
          </span>`;

        document.getElementById(
          "dataCard"
        ).open = true;
      }

    } catch (e) {}
  }


  async function uploadOne(
    inputId,
    field
  ) {

    const inp =
      document.getElementById(inputId);

    const st =
      document.getElementById(
        inputId === "fPlayers"
          ? "stPlayers"
          : "stSupp"
      );

    const f =
      inp.files[0];

    if (!f) {

      st.innerHTML =
        '<span style="color:#c53030">pick a file first</span>';

      return;
    }

    st.textContent =
      "uploading… (large files take a moment)";

    const fd =
      new FormData();

    fd.append(field, f);

    try {

      const r =
        await fetch("/upload", {
          method: "POST",
          body: fd
        }).then(
          r => r.json()
        );

      if (r.ok) {

        const n =
          (
            field === "players"
              ? r.player_rows
              : r.supplementary_rows
          ) || 0;

        st.innerHTML =
          `<span style="color:#2f855a">
            loaded
            ${n.toLocaleString()}
            rows - reloading…
          </span>`;

        await refreshDataStatus();

        setTimeout(
          () => location.reload(),
          400
        );

      } else {

        st.innerHTML =
          `<span style="color:#c53030">
            failed:
            ${r.error || "error"}
          </span>`;
      }

    } catch (e) {

      st.innerHTML =
        `<span style="color:#c53030">
          failed: ${e}
        </span>`;
    }
  }


  refreshDataStatus();
</script>


<script src="/app.js"></script>

</body>
</html>

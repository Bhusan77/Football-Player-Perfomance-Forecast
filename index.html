<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Scout · Day 5 lab (local)</title>
<link rel="stylesheet" href="/app.css" />
<style>
  /* Self-contained styles for the upload strip only - independent of Tailwind
     so it always renders, even before app.css loads. */
  .ds-wrap { max-width:1180px; margin:0 auto; padding:16px 20px 40px; }
  .ds-up { border:1px solid #e4ddcf; background:#fbf8f1; border-radius:12px;
           padding:12px 16px; margin-bottom:18px; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#33302b; }
  .ds-up summary { cursor:pointer; font-weight:600; }
  .ds-up .note { font-size:12px; color:#8a8378; }
  .ds-up code { background:#efe9dc; padding:1px 5px; border-radius:4px; font-size:12px; }
  .ds-row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; }
  .ds-up label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8a8378; margin-bottom:4px; }
  .ds-up input[type=file] { font:inherit; }
  .ds-btn { font:inherit; border:1px solid #2563eb; background:#2563eb; color:#fff;
            border-radius:8px; padding:8px 12px; cursor:pointer; }
</style>
</head>
<body>
<div class="ds-wrap">
  <details class="ds-up" id="dataCard">
    <summary>Data snapshot - <span id="dataStatus" style="font-weight:400;color:#8a8378">checking…</span></summary>
    <div class="ds-row" style="margin-top:12px">
      <div><label>players.csv(.gz)</label><input type="file" id="fPlayers" accept=".gz,.csv" /></div>
      <button class="ds-btn" onclick="uploadOne('fPlayers','players')">Upload players</button>
      <span id="stPlayers" class="note"></span>
    </div>
    <div class="ds-row">
      <div><label>supplementary.csv(.gz)</label><input type="file" id="fSupp" accept=".gz,.csv" /></div>
      <button class="ds-btn" onclick="uploadOne('fSupp','supplementary')">Upload supplementary</button>
      <span id="stSupp" class="note"></span>
    </div>
  </details>

  <!-- The exact Day 5 course lab (ScoutBuilderLab) mounts here. -->
  <div id="root"></div>
</div>

<script>
async function refreshDataStatus(){
  try{
    const s = await fetch("/status").then(r=>r.json());
    const el = document.getElementById("dataStatus");
    if((s.player_rows||0) > 0){
      el.innerHTML = `<span style="color:#2f855a">loaded - ${(s.player_rows).toLocaleString()} player rows, ${(s.supplementary_rows||0).toLocaleString()} supplementary</span>`;
      document.getElementById("dataCard").open = false;
    } else {
      el.innerHTML = `<span style="color:#c53030">no data loaded - upload the files below</span>`;
      document.getElementById("dataCard").open = true;
    }
  }catch(e){}
}
async function uploadOne(inputId, field){
  const inp = document.getElementById(inputId);
  const st = document.getElementById(inputId==="fPlayers"?"stPlayers":"stSupp");
  const f = inp.files[0];
  if(!f){ st.innerHTML = '<span style="color:#c53030">pick a file first</span>'; return; }
  st.textContent = "uploading… (large files take a moment)";
  const fd = new FormData(); fd.append(field, f);
  try{
    const r = await fetch("/upload", {method:"POST", body:fd}).then(r=>r.json());
    if(r.ok){
      const n = (field==="players" ? r.player_rows : r.supplementary_rows) || 0;
      st.innerHTML = `<span style="color:#2f855a">loaded ${n.toLocaleString()} rows - reloading…</span>`;
      await refreshDataStatus();
      // Re-mount the lab so it picks up the newly loaded data.
      setTimeout(()=>location.reload(), 400);
    } else {
      st.innerHTML = `<span style="color:#c53030">failed: ${r.error||"error"}</span>`;
    }
  }catch(e){ st.innerHTML = `<span style="color:#c53030">failed: ${e}</span>`; }
}
refreshDataStatus();
</script>
<script src="/app.js"></script>
</body>
</html>
